<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeDex</title>
    <link rel="shortcut icon" href="./assets/icons/pokeball.png" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body onload="showStartQuestion()">
    <nav>
      <div class="nav_content">
        <div class="nav_left">
          <a href="index.html" aria-label="Go to homepage">
            <img src="./assets/icons/pokeball.png" alt="" />
            <img src="./assets/icons/pokedex.png" alt="" />
          </a>
        </div>
        <div id="nav-right" class="nav_right d_none_three">
          <input id="search-field" type="text" placeholder="Search Pokemon..." />
          <button id="search-button" onclick="searchPokemon()">Search</button>
        </div>
      </div>
    </nav>
    <section class="compare_controls d_none_three" id="compare-controls">
      <div class="main_action_buttons">
        <button id="compare-button" class="compare_button" type="button" onclick="startCompareMode()">Compare Pokémon</button>
        <button id="generation-button" class="generation_button" type="button" onclick="openGenerationOverlay()">Choose Generation</button>
      </div>
      <p id="compare-message" class="compare_message" aria-live="polite"></p>
    </section>
    <section class="main_content_container" id="main-content-container"></section>
    <section class="loading_spinner_container" id="loading-spinner-container"></section>
    <section class="large_card_container d_none" id="large-card-container"></section>
    <section class="compare_overlay_container d_none" id="compare-overlay-container"></section>
    <section class="start_overlay" id="start-overlay"></section>
    <section class="wrong_answer_container d_none_three" id="wrong-answer-container"></section>
    <section class="generation_overlay_container d_none" id="generation-overlay-container"></section>
    <footer>
      <div class="footer_content">
        <p>Sascha Heinze 2025</p>
        <div class="footer_links">
          <a href="./datenschutz.html">Privacy Policy</a>
          <a href="./impressum.html">Imprint</a>
        </div>
      </div>
    </footer>
  </body>
</html>
